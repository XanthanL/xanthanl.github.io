<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" fill="none">
  <!-- XanthanL 项目星系主 Logo：带环行星 + 外层轨道 + 卫星 -->
  <defs>
    <radialGradient id="planet" cx="38%" cy="32%" r="75%">
      <stop offset="0%" stop-color="#7dff7d"/>
      <stop offset="45%" stop-color="#32cd32"/>
      <stop offset="100%" stop-color="#0b3d0b"/>
    </radialGradient>
    <radialGradient id="halo" cx="50%" cy="50%" r="50%">
      <stop offset="55%" stop-color="#32cd32" stop-opacity="0"/>
      <stop offset="85%" stop-color="#32cd32" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#32cd32" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ringGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#8b00ff"/>
      <stop offset="100%" stop-color="#c46bff"/>
    </linearGradient>
  </defs>

  <!-- 外层轨道（虚线） -->
  <circle cx="48" cy="48" r="42" stroke="#32cd32" stroke-opacity="0.28" stroke-width="1" stroke-dasharray="2 5"/>
  <!-- 行星辉光 -->
  <circle cx="48" cy="48" r="30" fill="url(#halo)"/>

  <g transform="rotate(-18 48 48)">
    <!-- 行星环（后半，被行星遮挡） -->
    <path d="M16 48a32 10 0 0 1 64 0" stroke="url(#ringGrad)" stroke-width="2.5" stroke-linecap="round" opacity="0.5"/>
    <!-- 行星本体 -->
    <circle cx="48" cy="48" r="17" fill="url(#planet)"/>
    <!-- 行星环（前半） -->
    <path d="M16 48a32 10 0 0 0 64 0" stroke="url(#ringGrad)" stroke-width="2.5" stroke-linecap="round"/>
  </g>

  <!-- 外轨道上的卫星 -->
  <circle cx="78" cy="19" r="3" fill="#8b00ff"/>
  <circle cx="78" cy="19" r="6" stroke="#8b00ff" stroke-opacity="0.35" stroke-width="1"/>

  <!-- 远景星点 -->
  <circle cx="14" cy="70" r="1.4" fill="#ffffff" opacity="0.8"/>
  <circle cx="26" cy="16" r="1" fill="#32cd32" opacity="0.9"/>
  <circle cx="84" cy="62" r="1.2" fill="#c46bff" opacity="0.8"/>
</svg>
