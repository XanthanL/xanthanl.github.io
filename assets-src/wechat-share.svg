<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" fill="none">
  <!-- 微信转发缩略图源文件：120x120，深空底 + 带环行星 + 轨道 -->
  <defs>
    <radialGradient id="wp" cx="38%" cy="32%" r="75%">
      <stop offset="0%" stop-color="#7dff7d"/>
      <stop offset="45%" stop-color="#32cd32"/>
      <stop offset="100%" stop-color="#0b3d0b"/>
    </radialGradient>
    <radialGradient id="wbg" cx="50%" cy="42%" r="80%">
      <stop offset="0%" stop-color="#0d1a0d"/>
      <stop offset="100%" stop-color="#020202"/>
    </radialGradient>
    <radialGradient id="whalo" cx="50%" cy="50%" r="50%">
      <stop offset="55%" stop-color="#32cd32" stop-opacity="0"/>
      <stop offset="85%" stop-color="#32cd32" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#32cd32" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- 深空背景与星点 -->
  <rect width="120" height="120" fill="url(#wbg)"/>
  <circle cx="18" cy="22" r="1.6" fill="#ffffff" opacity="0.8"/>
  <circle cx="100" cy="16" r="1.2" fill="#32cd32" opacity="0.9"/>
  <circle cx="106" cy="88" r="1.5" fill="#c46bff" opacity="0.8"/>
  <circle cx="26" cy="98" r="1.1" fill="#ffffff" opacity="0.55"/>
  <circle cx="64" cy="10" r="1" fill="#ffffff" opacity="0.5"/>

  <!-- 外层轨道 + 卫星 -->
  <circle cx="60" cy="56" r="48" stroke="#32cd32" stroke-opacity="0.3" stroke-width="1.2" stroke-dasharray="2.5 6"/>
  <circle cx="94" cy="22" r="3.6" fill="#8b00ff"/>
  <circle cx="94" cy="22" r="7" stroke="#8b00ff" stroke-opacity="0.35" stroke-width="1.2"/>

  <!-- 行星辉光与本体 -->
  <circle cx="60" cy="56" r="36" fill="url(#whalo)"/>
  <g transform="rotate(-18 60 56)">
    <path d="M22 56a38 12 0 0 1 76 0" stroke="#8b00ff" stroke-width="3.5" stroke-linecap="round" opacity="0.5"/>
    <circle cx="60" cy="56" r="20" fill="url(#wp)"/>
    <path d="M22 56a38 12 0 0 0 76 0" stroke="#8b00ff" stroke-width="3.5" stroke-linecap="round"/>
  </g>

  <!-- 底部品牌字 -->
  <text x="60" y="111" text-anchor="middle" font-family="Consolas, 'Courier New', monospace" font-size="11" font-weight="bold" letter-spacing="3" fill="#32cd32">XANTHAN</text>
</svg>
