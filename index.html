    <!-- 首屏 Loading：JS 下载/解析期间展示，React 挂载后自动被替换 -->
    <style>
      #root:empty + .boot-loader { display: flex; }
      .boot-loader {
        position: fixed; inset: 0; z-index: 999; display: none;
        flex-direction: column; align-items: center; justify-content: center; gap: 24px;
        background: #000; color: #32cd32;
        font-family: 'JetBrains Mono', Consolas, monospace;
        letter-spacing: 0.4em; font-size: 11px; text-transform: uppercase;
      }
      .boot-loader .orbit {
        width: 64px; height: 64px; border-radius: 50%;
        border: 1px dashed rgba(50, 205, 50, 0.35); position: relative;
        animation: boot-spin 3s linear infinite;
      }
      .boot-loader .orbit::after {
        content: ''; position: absolute; top: -4px; left: 50%;
        width: 8px; height: 8px; border-radius: 50%; background: #8b00ff;
      }
      .boot-loader .planet {
        position: absolute; inset: 22px; border-radius: 50%;
        background: radial-gradient(circle at 38% 32%, #7dff7d, #32cd32 45%, #0b3d0b);
      }
      .boot-loader .tip { animation: boot-blink 1.2s step-end infinite; }
      @keyframes boot-spin { to { transform: rotate(360deg); } }
      @keyframes boot-blink { 50% { opacity: 0.25; } }
    </style>
  </head>
  <body class="bg-background text-white selection:bg-primary/30">
    <div id="root"></div>
    <div class="boot-loader" aria-hidden="true">
      <div class="orbit"><div class="planet"></div></div>
      <div class="tip">Establishing Uplink...</div>
    </div>
